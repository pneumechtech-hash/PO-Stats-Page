name: Docker image

# On every push to main, builds the Docker image and publishes it to GitHub's
# container registry as ghcr.io/pneumechtech-hash/po-stats-page. The server's
# Dockge stack pulls it from there with its Update button.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/pneumechtech-hash/po-stats-page   # registry names must be lowercase

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Builds for regular PCs (amd64) and ARM boards like a Raspberry Pi (arm64)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Links the image to this repo, so it shares the repo's access settings
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
